<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 針對手機螢幕優化，確保寬度自動適應 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖片檢視</title>
  <style>
    /* 移除邊界並將背景設為深色/黑色，讓圖片更突出 */
    body {
      margin: 0;
      padding: 0;
      background-color: #0e0e10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden; /* 避免產生無謂的捲軸 */
    }

    /* 確保圖片縮放不超頁面，同時維持比例 */
    img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- 將你的圖片網址貼在 src="" 裡面 -->
  <img src="20261003.jpg" alt="展示圖片">

</body>
</html>
